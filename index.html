<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梓琪的課表</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7280;
    --line:#e6e8ee; --accent:#3b82f6; --accent-soft:#e8f0ff;
    --now:#f59e0b; --now-soft:#fff5e6; --rest:#9aa2b1;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12141a; --card:#1b1e26; --ink:#e8eaf0; --muted:#9aa2b1;
      --line:#2a2e38; --accent:#5b9bff; --accent-soft:#1f2b40;
      --now:#f5a623; --now-soft:#38300f; --rest:#5a6172;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .status{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);
    color:var(--accent);font-weight:600;margin-bottom:14px}
  .status.rest{background:transparent;color:var(--muted);border:1px dashed var(--line)}
  /* timeline */
  .row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .t{flex:0 0 84px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;
    padding-top:2px}
  .row .a{font-size:15px}
  .row.fixed .a{color:var(--muted)}
  .row.now{background:var(--now-soft);border-radius:10px;margin:0 -8px;padding-left:8px;
    padding-right:8px;border-top-color:transparent}
  .row.now .t{color:var(--now);font-weight:700}
  .row.now .a{font-weight:700}
  .row.now .a::after{content:"　● 進行中";color:var(--now);font-size:12px;font-weight:600}
  .star{color:var(--accent);font-size:12px}
  /* full grid */
  details{margin-top:2px}
  summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;
    list-style:none;padding:4px 0}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
  table{border-collapse:collapse;font-size:12px;min-width:520px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
  th{background:var(--accent-soft);color:var(--accent);position:sticky;top:0}
  td.time{color:var(--muted);font-variant-numeric:tabular-nums}
  th.today,td.today{background:var(--now-soft)}
  /* calendar */
  .ev{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .ev:first-child{border-top:0}
  .ev .d{flex:0 0 62px;text-align:center}
  .ev .d .day{font-size:20px;font-weight:700;line-height:1}
  .ev .d .md{font-size:11px;color:var(--muted)}
  .ev .txt{font-size:14px;padding-top:1px}
  .ev.holiday .d .day{color:#ef4444}
  .badge{font-size:11px;color:#ef4444;border:1px solid #ef4444;border-radius:6px;
    padding:0 5px;margin-left:6px;vertical-align:middle}
  .empty{color:var(--muted);font-size:14px}
  .next-hint{color:var(--muted);font-size:13px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line)}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
</style>

<div class="wrap">
  <h1>梓琪的課表 📚</h1>
  <div class="sub" id="today"></div>

  <div class="card">
    <div class="status" id="status"></div>
    <h2>🗓️ 今日課表</h2>
    <div id="timeline"></div>
    <details>
      <summary>看完整週課表</summary>
      <div class="scroll"><table id="grid"></table></div>
      <div class="sub" style="margin:8px 0 0">＊拼音練習：一、三、五上午；自然生態：週四下午。</div>
    </details>
  </div>

  <div class="card">
    <h2>📌 接下來一週・鎮昌國小行事曆</h2>
    <div id="calendar"></div>
  </div>

  <footer>資料來源：暑假課後班課程表 ＋ 鎮昌國小 115 學年度第 1 學期行事曆</footer>
</div>

<script>
// ---- 課程資料 ----
const COURSE_TIMES = ["09:00–09:50","10:00–10:50","11:00–11:50","14:00–14:50","15:00–15:50","16:30–17:20"];
const WEEK = ["星期一","星期二","星期三","星期四","星期五"];
const COURSES = [ // [週一..週五]，每列一個時段
  ["拼音練習＊","認識時鐘","拼音練習＊","數字遊戲","拼音練習＊"],
  ["拼音練習＊","愛塗鴉","拼音練習＊","筆順練習","拼音練習＊"],
  ["專注力遊戲","筆順練習","影片欣賞","口語表達","繪本引導"],
  ["昆蟲 Life 秀","創意 DIY","團康遊戲","自然生態＊","唱跳音符"],
  ["認識校園","品格生活","生活知能","安全教育","益智遊戲"],
  ["團隊活動","體能活動","角落活動","球類活動","戶外遊戲"],
];
const FIXED = [ // 每日固定作息
  ["07:30–08:00","互道早安、歡喜上學（到校）"],
  ["08:00–08:50","晨間運動"],
  ["12:00–12:40","午餐"],
  ["12:40–13:50","午睡"],
  ["16:00–16:20","點心時間"],
  ["17:30–18:00","打掃環境、等家長接回"],
];

// ---- 行事曆（115 學年 = 2026；1月屬 2027）。單日或起訖。無明確日期的月度宣導不列 ----
const EVENTS = [
  ["2026-08-31",null,"開學日・新生始業典禮・課後照顧班正式上課",false],
  ["2026-09-09",null,"國民體育日",false],
  ["2026-09-16",null,"地震避難演練及校園人為災害演練",false],
  ["2026-09-21",null,"國家防災日",false],
  ["2026-09-23",null,"牙齒檢查 (1)",false],
  ["2026-09-25",null,"中秋節放假 1 天",true],
  ["2026-09-28",null,"教師節放假 1 天",true],
  ["2026-09-30",null,"牙齒檢查 (2)",false],
  ["2026-10-01",null,"舉辦班親會",false],
  ["2026-10-09",null,"國慶日補假 1 天",true],
  ["2026-10-16",null,"親職教育講座",false],
  ["2026-10-20","2026-10-22","國小體促會躲避球賽（暫定）",false],
  ["2026-10-23",null,"第一次學生週會",false],
  ["2026-10-26",null,"臺灣光復暨金門古寧頭大捷紀念日補假 1 天",true],
  ["2026-11-02","2026-11-06","第 1 次定期評量週（期中考）",false],
  ["2026-12-05",null,"運動會",false],
  ["2026-12-07",null,"運動會補休",true],
  ["2026-12-11",null,"親職教育講座",false],
  ["2026-12-18",null,"第二次學生週會",false],
  ["2026-12-25",null,"行憲紀念日放假 1 天",true],
  ["2027-01-01",null,"開國紀念日放假 1 天",true],
  ["2027-01-11","2027-01-15","第 2 次定期評量週（期末考）",false],
  ["2027-01-19",null,"跳蚤市場（資源回收及理財教育）",false],
  ["2027-01-20",null,"第一學期課程結束",false],
];

const pad = n => String(n).padStart(2,"0");
const toMin = hhmm => { const [h,m]=hhmm.split(":").map(Number); return h*60+m; };
// 解析 "09:00–09:50" -> [start,end] 分鐘
function slotRange(t){ const [a,b]=t.split("–"); return [toMin(a),toMin(b)]; }

const now = new Date();
const dow = now.getDay(); // 0=日..6=六
const nowMin = now.getHours()*60 + now.getMinutes();
const isWeekday = dow>=1 && dow<=5;

// 標題日期
const wlabel = ["日","一","二","三","四","五","六"][dow];
document.getElementById("today").textContent =
  `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}（週${wlabel}）`;

// ---- 今日課表 timeline ----
const tl = document.getElementById("timeline");
const statusEl = document.getElementById("status");

if(!isWeekday){
  statusEl.className = "status rest";
  statusEl.textContent = "今天是週末，課後班休息 😴";
  tl.innerHTML = '<div class="empty">週六日沒有課程，好好休息！</div>';
}else{
  const col = dow-1; // 0=週一
  // 合併固定 + 課程，依開始時間排序
  let items = FIXED.map(f=>({t:f[0],a:f[1],fixed:true}));
  COURSE_TIMES.forEach((t,i)=> items.push({t,a:COURSES[i][col],fixed:false}));
  items.sort((x,y)=> slotRange(x.t)[0]-slotRange(y.t)[0]);

  let current = null;
  items.forEach(it=>{ const [s,e]=slotRange(it.t); if(nowMin>=s && nowMin<e) current=it; });

  tl.innerHTML = items.map(it=>{
    const [s,e]=slotRange(it.t);
    const on = (nowMin>=s && nowMin<e);
    const a = it.a.replace("＊",'<span class="star">＊</span>');
    return `<div class="row ${it.fixed?'fixed':''} ${on?'now':''}">
      <div class="t">${it.t}</div><div class="a">${a}</div></div>`;
  }).join("");

  // 狀態列
  if(current){
    statusEl.textContent = `現在：${current.a.replace("＊","")}（${current.t}）`;
  }else{
    const upcoming = items.find(it=> slotRange(it.t)[0] > nowMin);
    if(nowMin < slotRange(items[0].t)[0])
      statusEl.textContent = `還沒開始，第一節 ${items[0].t}：${items[0].a.replace("＊","")}`;
    else if(upcoming)
      statusEl.textContent = `休息中，下一節 ${upcoming.t}：${upcoming.a.replace("＊","")}`;
    else
      statusEl.textContent = "今天課程都結束囉 🎒";
  }
}

// ---- 完整週課表 grid ----
const grid = document.getElementById("grid");
let html = "<tr><th>時段</th>" + WEEK.map((w,i)=>
  `<th class="${isWeekday&&i===dow-1?'today':''}">${w}</th>`).join("") + "</tr>";
COURSE_TIMES.forEach((t,r)=>{
  html += `<tr><td class="time">${t}</td>` + COURSES[r].map((c,i)=>
    `<td class="${isWeekday&&i===dow-1?'today':''}">${c}</td>`).join("") + "</tr>";
});
grid.innerHTML = html;

// ---- 接下來一週行事曆 ----
const cal = document.getElementById("calendar");
const midnight = new Date(now.getFullYear(),now.getMonth(),now.getDate());
const weekEnd = new Date(midnight.getTime() + 7*86400000);
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };

function evDate(ev){ return parse(ev[0]); }
// 落在 [今天, 今天+7天) 內（單日或區間有交集）
const within = EVENTS.filter(ev=>{
  const s = parse(ev[0]); const e = ev[1]?parse(ev[1]):s;
  return e >= midnight && s < weekEnd;
});

function evRow(ev){
  const s = parse(ev[0]);
  const holiday = ev[3];
  const range = ev[1] ? `${pad(s.getMonth()+1)}/${pad(s.getDate())}–${ev[1].slice(5).replace("-","/")}` :
    `${pad(s.getMonth()+1)}/${pad(s.getDate())}`;
  const wl = ["日","一","二","三","四","五","六"][s.getDay()];
  return `<div class="ev ${holiday?'holiday':''}">
    <div class="d"><div class="day">${s.getDate()}</div><div class="md">${range} 週${wl}</div></div>
    <div class="txt">${ev[2]}${holiday?'<span class="badge">放假</span>':''}</div></div>`;
}

if(within.length){
  cal.innerHTML = within.map(evRow).join("");
}else{
  const next = EVENTS.find(ev=> (ev[1]?parse(ev[1]):parse(ev[0])) >= midnight);
  cal.innerHTML = '<div class="empty">接下來一週沒有排定的行事曆活動 🙂</div>' +
    (next ? `<div class="next-hint">下一個活動：${pad(parse(next[0]).getMonth()+1)}/${pad(parse(next[0]).getDate())}　${next[2]}</div>` : "");
}
</script>
