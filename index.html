<!DOCTYPE html>
<html lang="zh-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24211d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>一年三班課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>try{var _t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=_t;}catch(e){document.documentElement.dataset.theme='light';}</script>
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('preanim')</script>
<style>
  :root{
    --paper:#fbf7f0; --card:#ffffff; --ink:#413b34; --muted:#7a7067;
    --line:#ece5db; --rail:#ddd5c9; --accent:#39755d; --accent-weak:#e3ede9; /* 木賊色 · 進行中主色 */
    --holiday:#ab3b3a; --holiday-weak:#f7e3e2;
    --sport:#376b6d; --sport-weak:#e0eaea; /* 運動會 */
    /* 明亮童趣科目色 */
    --c-lang:#d0576b; --c-lang-w:#f7e4e7; --c-lang-t:#be354c; /* 今様色 · 語文/社會 */
    --c-math:#2c82be; --c-math-w:#e1eef8; --c-math-t:#2670a4; /* 縹色 · 數理 */
    --c-nat:#4ea47b;  --c-nat-w:#e1f0e9; --c-nat-t:#39775a;  /* 若竹色 · 自然/體育 */
    --c-art:#e0902d;  --c-art-w:#fbecd2; --c-art-t:#995f17;  /* 柑子色 · 藝術 */
    --shadow:0 1px 2px rgba(75,70,65,.04),0 8px 22px rgba(75,70,65,.07);
    --shadow-lift:0 2px 8px rgba(64,91,85,.18),0 14px 30px rgba(75,70,65,.13);
  }
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{
      color-scheme:dark;
      --paper:#24211d; --card:#2c2823; --ink:#ece5d9; --muted:#a89f92;
      --line:#39332c; --rail:#463f37; --accent:#86b0a5; --accent-weak:#2b3733;
      --holiday:#d97b79; --holiday-weak:#3a2523;
      --sport:#96c3c4; --sport-weak:#22312f;
      --c-lang:#e88a99; --c-lang-w:#3a2a2d; --c-lang-t:#e88a99;
      --c-math:#79b3e0; --c-math-w:#24303a; --c-math-t:#79b3e0;
      --c-nat:#82c187;  --c-nat-w:#263320; --c-nat-t:#82c187;
      --c-art:#eab662;  --c-art-w:#362d1c; --c-art-t:#eab662;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32);
      --shadow-lift:0 2px 8px rgba(134,176,165,.16),0 14px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{touch-action:manipulation}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background-color .3s cubic-bezier(.23,1,.32,1),color .3s cubic-bezier(.23,1,.32,1)}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 56px}
  .preanim .reveal{opacity:0}
  /* 骨架佔位：JS 注入內容前先撐開版位，避免整頁下推（CLS 0.57 -> 0）*/
  #status:empty{min-height:115px}
  #timeline:empty{min-height:1008px}
  #calendar:empty{min-height:72px}

  /* ---- header ---- */
  header{position:relative}
  .themetog{position:absolute;top:-2px;right:-2px;width:35px;height:35px;z-index:5;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;
    background:var(--card);color:var(--muted);cursor:pointer;box-shadow:var(--shadow);
    -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,transform .16s cubic-bezier(.23,1,.32,1)}
  /* 右上角整塊都能按：把可點範圍往外撐到約 55×55，視覺仍是 35px 圓鈕 */
  .themetog::after{content:"";position:absolute;inset:-10px;border-radius:50%}
  .themetog:active{color:var(--accent);background:var(--accent-weak);transform:scale(.96)}
  @media(hover:hover)and(pointer:fine){.themetog:hover{color:var(--accent)}}
  .themetog .ic{width:22px;height:22px}
  .themetog .ic-moon{display:none}
  :root[data-theme="dark"] .themetog .ic-sun{display:none}
  :root[data-theme="dark"] .themetog .ic-moon{display:block}
  .notifytog{position:absolute;top:-2px;right:38px;width:35px;height:35px;z-index:5;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;
    background:var(--card);color:var(--muted);cursor:pointer;box-shadow:var(--shadow);
    -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,transform .16s cubic-bezier(.23,1,.32,1)}
  .notifytog::after{content:"";position:absolute;inset:-10px;border-radius:50%}
  .notifytog:active{color:var(--accent);background:var(--accent-weak);transform:scale(.96)}
  @media(hover:hover)and(pointer:fine){.notifytog:hover{color:var(--accent)}}
  .notifytog .ic{width:20px;height:20px}
  .notifytog.on{color:var(--accent)}
  .notifytog.on .ndot{position:absolute;top:6px;right:7px;width:7px;height:7px;
    border-radius:50%;background:var(--accent);border:2px solid var(--card)}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;
    color:var(--accent);margin:0 0 8px}
  h1{font-size:29px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
  .datebar{display:flex;align-items:center;gap:9px;margin-top:8px;color:var(--muted);font-size:15px}
  .datebar .num{font-size:16px}
  .schoolink{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 13px;
    border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
    -webkit-tap-highlight-color:transparent;transition:box-shadow .2s,color .2s}
  @media(hover:hover)and(pointer:fine){.schoolink:hover{color:var(--accent);box-shadow:var(--shadow-lift)}}
  .schoolink svg{width:15px;height:15px;color:var(--accent)}
  .schoolink .arw{width:13px;height:13px;color:var(--muted)}
  .schoolink b{color:var(--accent)}

  /* ---- status ---- */
  .status{margin:22px 0 16px;padding:16px 18px;border-radius:9px;background:var(--card);
    box-shadow:var(--shadow);border:1px solid var(--line)}
  .status .k{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
  .status .v{font-size:20px;font-weight:600}
  .status .t{color:var(--accent);font-size:15px;margin-top:4px}
  .status.rest .v{color:var(--muted);font-weight:500}
  .status .next-lbl{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-weak);
    padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:middle;letter-spacing:.05em}

  /* ---- legend ---- */
  .legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:0 2px 22px;
    font-size:13px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%}

  /* ---- timeline ---- */
  .tl{position:relative}
  .node{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;padding:7px 0}
  .rail{position:relative;display:flex;justify-content:center}
  .rail::before{content:"";position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--rail)}
  .node:first-child .rail::before{top:14px}
  .node:last-child .rail::before{bottom:calc(100% - 14px)}
  .dot{position:relative;z-index:1;width:11px;height:11px;border-radius:50%;
    background:var(--c,var(--rail));margin-top:15px;box-shadow:0 0 0 4px var(--paper)}
  .node.fixed .dot{width:7px;height:7px;margin-top:17px;background:var(--rail)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:12px 15px;box-shadow:inset 3px 0 0 var(--c,transparent),var(--shadow);
    display:flex;align-items:baseline;gap:12px}
  .node.fixed .card{background:transparent;border-color:transparent;box-shadow:none;padding:11px 15px}
  .time{flex:0 0 auto;font-size:16px;font-weight:600;color:var(--ink)}
  .time .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
  .node.fixed .time{color:var(--muted);font-weight:500}
  .name{font-size:17px;font-weight:600}
  .node.fixed .name{font-size:16px;font-weight:400;color:var(--muted)}
  .name .tch{margin-left:6px;font-size:13px;font-weight:400;color:var(--muted)}
  .chip{margin-left:auto;align-self:flex-start;margin-top:2px;flex:0 0 auto;font-size:12px;font-weight:600;
    color:var(--ct,var(--c));background:var(--cw);padding:2px 9px;border-radius:999px;letter-spacing:.02em}

  /* current class */
  .node.now .dot{background:var(--accent);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--accent-weak)}
  .node.now .card{box-shadow:inset 3px 0 0 var(--accent),var(--shadow-lift);padding-bottom:34px}
  .node.now .time,.node.now .name{color:var(--accent)}
  /* now line */
  .nowline{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;
    align-items:center;padding:9px 0;margin:1px 0}
  .nl-rail{position:relative;display:flex;justify-content:center}
  .nl-rail span{width:13px;height:13px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--accent-weak)}
  .nl-body{display:flex;align-items:center;gap:10px}
  .nl-time{font-size:15px;font-weight:700;color:var(--accent)}
  .nl-label{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent)}
  .nl-rule{flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent);
    transform-origin:left center}
  /* 跑步的馬尾小女孩：站在進度條尖端＝「現在」，頭上小膠囊顯示現在時間 */
  .node.now .nowrunner{position:absolute;bottom:8px;margin-left:-12px;z-index:3;pointer-events:none}
  /* 不加 filter：四肢每幀轉動，drop-shadow 會每幀重算；SVG 內已有 .shadow 假影子 */
  .node.now .nowrunner .runner{display:block;width:24px;height:auto;overflow:visible}
  .node.now .rtime{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    margin-bottom:2px;white-space:nowrap;font-size:10.5px;font-weight:700;color:var(--accent);
    background:var(--card);padding:1px 6px;border-radius:999px;
    box-shadow:0 1px 5px rgba(59,121,96,.28),0 0 0 1px var(--accent-weak)}

  /* ---- weekly grid ---- */
  .more{margin-top:26px;border-top:1px solid var(--line);padding-top:6px}
  summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    padding:10px 2px;font-size:15px;font-weight:600;color:var(--ink);user-select:none}
  summary::-webkit-details-marker{display:none}
  .chev{width:16px;height:16px;color:var(--accent);transition:transform .25s cubic-bezier(.23,1,.32,1)}
  details[open] .chev{transform:rotate(90deg)}
  .grid-note{font-size:13px;color:var(--muted);margin:6px 0 12px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
  table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:500px;width:100%}
  th,td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em}
  td{color:var(--ct,var(--ink));font-weight:500}
  td.time-c{color:var(--muted);text-align:left;font-weight:400}
  td.span{color:var(--muted);font-weight:400;letter-spacing:.3em}
  th.today{color:var(--accent)}
  td.today{box-shadow:inset 0 0 0 999px var(--accent-weak)}
  tr:last-child td{border-bottom:none}

  /* ---- calendar ---- */
  .cal{margin-top:34px}
  .cal-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .cal-head h2{font-size:19px;font-weight:700;margin:0}
  .cal-head .rng{font-size:13px;color:var(--muted)}
  .cal-head .all{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent);
    text-decoration:none;white-space:nowrap;transition:opacity .2s}
  @media(hover:hover)and(pointer:fine){.cal-head .all:hover{opacity:.72}}
  .cal-sub{font-size:14px;color:var(--muted);margin:0 0 14px}
  .ev{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:none}
  .ev .d{text-align:center}
  .ev .d .dd{font-size:25px;font-weight:700;line-height:1}
  .ev .d .wl{font-size:12px;color:var(--muted);margin-top:3px}
  .ev .rng2{font-size:12px;color:var(--muted);margin-top:2px}
  .ev .txt{align-self:center;font-size:16px;font-weight:500}
  .ev.holiday .d .dd{color:var(--holiday)}
  .ev.sport .d .dd,.ev.sport .txt{color:var(--sport)}
  .ev.sport .txt{font-weight:600}
  .ev.sport .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--sport);
    background:var(--sport-weak);padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .ev.holiday .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--holiday);
    background:var(--holiday-weak);padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .empty{color:var(--muted);font-size:16px;padding:8px 0}
  .next{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px}
  .next b{color:var(--accent)}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;line-height:1.7}
  /* ---- 進度條 · 剩餘時間 ---- */
  .status .bar{height:5px;border-radius:999px;background:var(--accent-weak);margin-top:11px;overflow:hidden}
  .status .bar i{display:block;width:100%;height:100%;border-radius:999px;background:var(--accent);transform-origin:left center}
  .status .rem{color:var(--muted);font-size:13.5px;margin-top:8px}
  .status .rem b{color:var(--accent);font-weight:700}
  .status .rem.pe{margin-top:10px;padding:7px 10px;border-radius:8px;
    background:var(--accent-weak);color:var(--ink)}
  .node.now .card{position:relative}
  .node.now .prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--accent-weak);
    border-radius:0 0 8px 8px;overflow:hidden}
  .node.now .prog i{display:block;width:100%;height:100%;background:var(--accent);
    transform-origin:left center}

  /* ---- now-line 呼吸光暈 ---- */
  .nl-rail span{position:relative}
  .nl-rail span b{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}

  /* ---- 行事曆捲動進場 ---- */
  .io-hidden{opacity:0;transform:translateY(16px) scale(.97)}
  .io-in{opacity:1;transform:none;transition:opacity .4s cubic-bezier(.23,1,.32,1),transform .4s cubic-bezier(.23,1,.32,1)}
  .ev:nth-child(2) .io-in,.ev:nth-child(2).io-in{transition-delay:50ms}
  .ev:nth-child(3) .io-in,.ev:nth-child(3).io-in{transition-delay:100ms}
  .ev:nth-child(4) .io-in,.ev:nth-child(4).io-in{transition-delay:150ms}
  .ev:nth-child(5) .io-in,.ev:nth-child(5).io-in{transition-delay:200ms}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  @media (max-width:360px){h1{font-size:25px}.wrap{padding:22px 14px 48px}}
</style>

<div class="wrap">
  <header>
    <button class="notifytog" id="notifytog" type="button" aria-label="下課通知">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="ndot"></span>
    </button>
    <button class="themetog" id="themetog" type="button" aria-label="切換深色／淺色">
      <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <p class="eyebrow reveal">鎮昌國小 一年三班 · 導師：謝懿雯</p>
    <h1 class="reveal">今日課表</h1>
    <div class="datebar reveal">
      <span class="num" id="today"></span>
    </div>
  </header>

  <section class="status reveal" id="status" role="status"></section>

  <div class="legend reveal">
    <span><i style="background:var(--c-lang)"></i>語文</span>
    <span><i style="background:var(--c-math)"></i>數學</span>
    <span><i style="background:var(--c-nat)"></i>健體</span>
    <span><i style="background:var(--c-art)"></i>生活</span>
  </div>

  <div class="tl" id="timeline"></div>

  <details class="more reveal">
    <summary>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      完整一週課表
    </summary>
    <p class="grid-note">科任教室：健康 109、彈英 110、台語 311。</p>
    <div class="scroll"><table id="grid"></table></div>
  </details>

  <section class="cal reveal">
    <div class="cal-head"><h2>接下來一週</h2><span class="rng" id="calrange"></span>
      <a class="all" href="calendar.html">全部行事曆 →</a></div>
    <p class="cal-sub">鎮昌國小 115 學年度第 1 學期行事曆</p>
    <div id="calendar"></div>
  </section>

  <a class="schoolink reveal" href="school.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>校園資訊</span>
    <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <footer>
    資料來源：鎮昌國小 115 學年度一年三班課表 ＋ 課後照顧班 1A 課表 ＋ 第 1 學期行事曆<br>
    週二上到 15:55，其餘四天午休後放學；放學後到課後輔導班，18:00 接回。<br>
    <a href="snack.html">8、9 月點心表 →</a>
  </footer>
</div>

<script src="events.js"></script>
<script>
// ---- 課程資料 ----
const WEEK = ["星期一","星期二","星期三","星期四","星期五"];
// 一列＝一個時段；字串＝全週相同，陣列＝一～五，null＝當天沒排
const ROWS = [
  ["07:50–08:05", ["打掃","教師晨會","打掃","打掃","打掃"]],
  ["08:05–08:15", ["生活指導","教師晨會","升旗","閱讀指導","生活指導"]],
  ["08:15–08:35", "導師時間"],
  ["08:40–09:20", ["數學","數學","數學","數學","彈性"]],

    // 2: 背面（馬尾反向、提腳反側）
    `<ellipse cx="20" cy="43" rx="5" ry="1.2" fill="var(--accent)" stroke="none" opacity=".10"/>
     <path d="M25 8 C 29 5,32 10,30 16" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <line x1="20" y1="14" x2="20" y2="29" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round"/>
     <path d="M20 29 L20 41" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <path d="M20 29 L13 25" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <path d="M20 18 L26 10" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <path d="M20 18 L14 10" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <circle cx="20" cy="9" r="6.2" fill="var(--accent)" stroke="none"/>
     <circle cx="25" cy="8" r="1.5" fill="#f0c050" stroke="none"/>`,
    // 3: 側面（另一側）
    `<ellipse cx="20" cy="43" rx="3" ry="1" fill="var(--accent)" stroke="none" opacity=".06"/>
     <line x1="20" y1="14" x2="20" y2="29" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round"/>
     <path d="M20 29 L20 41" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <path d="M20 29 L17 26" stroke="var(--accent)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
     <path d="M20 18 L20 10" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" fill="none"/>
     <circle cx="20" cy="9" r="5.4" fill="var(--accent)" stroke="none"/>`,
  ];
  function doJump(){
    if(_runnerOff || !document.querySelector(".node.now .runner")) return;
    _runTs=Date.now();
    gsap.killTweensOf(parts);
    const sv=document.querySelector(S); if(!sv) return;
    _jumpTL=gsap.timeline({onComplete(){_jumpTL=null;_runTs=Date.now();setFrame(sv,RUNNER_INNER);gsap.set(S,{y:0,rotation:lean,scaleX:1,svgOrigin:"20 40"});startRun();_jumpTimer=gsap.delayedCall(jInt+Math.random()*1.5,doJump);}});
    const tl=_jumpTL;
    // 準備：四肢收進 passé 姿勢
    tl.to(S,{y:-3,rotation:0,svgOrigin:"20 40",duration:.2,ease:"power2.out"},0)
      .to(`${S} .leg-f`,{rotation:80,svgOrigin:"19 29",duration:.2},0)
      .to(`${S} .leg-b`,{rotation:2,svgOrigin:"19 29",duration:.2},0)
      .to(`${S} .arm-f`,{rotation:-75,svgOrigin:"20 18",duration:.2},0)
      .to(`${S} .arm-b`,{rotation:70,svgOrigin:"20 18",duration:.2},0)
      .to(`${S} .pony, ${S} .tie`,{rotation:20,svgOrigin:"15 8",duration:.2},0)
      .to(`${S} .shadow`,{scaleX:.4,opacity:.06,svgOrigin:"20 43",duration:.2},0)
    // 跳起 + 逐格轉圈（正→側→背→側→正）
      .call(()=>{setFrame(sv,PIRO[0]);},[],0.22)
      .to(S,{y:-20,duration:.25,ease:"sine.out"},.22)
      .call(()=>{setFrame(sv,PIRO[1]);},[],0.35)
      .call(()=>{setFrame(sv,PIRO[2]);},[],0.48)
      .call(()=>{setFrame(sv,PIRO[3]);},[],0.61)
      .call(()=>{setFrame(sv,PIRO[0]);},[],0.74)
      .to(S,{y:-16,duration:.35,ease:"sine.inOut"},.47)
    // 落地：下墜要加速（重力），觸地後小回彈，不要用 bounce.out 一路減速飄下來
      .to(S,{y:0,duration:.18,ease:"power2.in"},.82)
      .to(S,{y:-3,duration:.1,ease:"power2.out"})
      .to(S,{y:0,duration:.14,ease:"power2.in"})
      .set(S,{rotation:lean,svgOrigin:"20 40"});
  }
  startRun();
  _jumpTimer=gsap.delayedCall(jInt+Math.random()*1.5,doJump);
}

// ---- 捲出視窗就停跑（省電；也免得在看不見的地方全速跑一整天）----
// 停＝殺掉重建，不做 pause/resume：這是 idle 迴圈，重新起跑看不出差別，程式少一半
function killRunner(){
  if(_jumpTimer){ _jumpTimer.kill(); _jumpTimer=null; }
  if(_jumpTL){ _jumpTL.kill(); _jumpTL=null; }
  if(_actionTL){ _actionTL.kill(); _actionTL=null; }
  gsap.killTweensOf(".node.now .runner");
  gsap.killTweensOf(".node.now .runner *");
}
function startRunner(){ killRunner(); _runnerOff=false;   // killRunner 讓重複呼叫安全
  if(pose==='run') loopRunner(runnerPhase()); else POSES[pose].loop(); }
function stopRunner(){ _runnerOff=true; killRunner(); }

let out = "";
items.forEach((it,idx)=>{
  if(inSession && !current && idx===insertBefore) out += nowLineHTML;
  const [start,end]=it.t.split("–");
  const on = current===it;
  const cat = it.fixed ? null : catOf(it.a);
  const name = it.a + (TEACHER[it.a] ? `<span class="tch">${TEACHER[it.a]}</span>` : "");
  const chip = cat ? `<span class="chip">${SUBJECT[it.a.replace("＊","")]||CAT[cat]}</span>` : "";
  const [cs,ce]=range(it.t);
  const runner = on ? `<div class="nowrunner" data-pose="${pose}" style="left:${pct(cs,ce)}%">
      <span class="rtime num">${pad(now.getHours())}:${pad(now.getMinutes())}</span>
      ${pose==='run'?RUNNER_SVG:POSES[pose].svg}</div>` : "";
  const prog = on ? `<div class="prog"><i style="transform:scaleX(${(pct(cs,ce)/100).toFixed(4)})"></i></div>${runner}` : "";
  out += `<div class="node reveal ${it.fixed?'fixed':''} ${on?'now':''}" style="${catStyle(cat)}">
    <div class="rail"><span class="dot"></span></div>
    <div class="card">
      <div class="time num">${start}<span class="sub">${end}</span></div>
      <div class="name">${name}</div>${chip}${prog}
    </div></div>`;
});
if(inSession && !current && insertBefore===-1) out += nowLineHTML;
tl.innerHTML = out;

if(current){
  const [cs,ce]=range(current.t);
  statusEl.innerHTML = `<div class="k">現在進行</div>
    <div class="v">${current.a.replace("＊","")}</div><div class="t num">${current.t}</div>
    <div class="bar"><i style="transform:scaleX(${(pct(cs,ce)/100).toFixed(4)})"></i></div>
    <div class="rem">還有 <b class="num">${ce-nowMin}</b> 分鐘下課</div>`;
  // 每 30 秒更新剩餘時間（ponytail: 跨節不即時重繪，換節靠下次載入）
  setInterval(()=>{
    if(document.hidden) return; // 背景頁籤不堆 tween
    const d=new Date(), m=d.getHours()*60+d.getMinutes();
    if(m<cs||m>=ce) return;
    const rb=statusEl.querySelector(".rem b"); if(rb) rb.textContent=ce-m;
    const p=Math.min(100,Math.max(0,(m-cs)/(ce-cs)*100));
    const sb=statusEl.querySelector(".bar i"), cb=document.querySelector(".node.now .prog i");
    const rn=document.querySelector(".node.now .nowrunner"), prg=document.querySelector(".node.now .prog");
    if(canAnim){
      // 滑 2 秒到新位置：連續移動取代瞬移，且每 30 秒對一次真實時間，不會漂移
      gsap.to([sb,cb].filter(Boolean),{scaleX:p/100,duration:2,ease:"none",overwrite:true});
      // 跑者位移走 transform 不走 left，避免每幀 layout
      if(rn&&prg) gsap.to(rn,{x:prg.clientWidth*(p-pct(cs,ce))/100,duration:2,ease:"none",overwrite:true});
    }else{
      if(sb) sb.style.transform="scaleX("+(p/100).toFixed(4)+")";
      if(cb) cb.style.transform="scaleX("+(p/100).toFixed(4)+")";
      if(rn) rn.style.left=p+"%";
    }
    // 捲出視窗時不重啟；捲回來時 startRunner 自然會抓當下的 phase
    if(canAnim && rn && !_runnerOff){
      if(pose==='run'){ const ph=runnerPhase();
        if(rn.dataset.phase!==ph || Date.now()-_runTs>10000) loopRunner(ph); } // phase 變或鏈斷→重啟
      else if(Date.now()-_actionTs>5000) POSES[pose].loop(); // 非 run 姿勢斷鏈→重啟
    }
  },30000);
}else if(holidayEvent){
  statusEl.className = "status rest reveal";
  statusEl.innerHTML = `<div class="k">今天放假</div>
    <div class="v">${holidayEvent[2]}</div>
    <div class="t num">下一個上課日 ${md(disp)}（週${WL[dispDow]}），${items[0].t} 開始</div>`;
}else if(!live){
  const diff = Math.round((new Date(disp.getFullYear(),disp.getMonth(),disp.getDate())
    - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  statusEl.className = "status rest reveal";
  // 有體育課（週一、週四）要提醒穿運動服
  const pe = items.some(it=>it.a==="體育");
  statusEl.innerHTML = `<div class="k">${diff===1?'明天課表':'週'+WL[dispDow]+'課表'}</div>
    <div class="v">${items[0].a.replace("＊","")}</div><div class="t num">${items[0].t} 開始</div>
    ${pe?'<div class="rem pe">有<b>體育課</b>，要穿運動服和運動鞋</div>':''}`;
}else if(nowMin < dayStart){
  statusEl.innerHTML = `<div class="k">今天還沒開始</div>
    <div class="v">${items[0].a.replace("＊","")}</div><div class="t num">${items[0].t} 開始</div>
    <div class="rem">再 <b class="num">${dayStart-nowMin}</b> 分鐘開始</div>`;
}else if(nowMin >= dayEnd){
  statusEl.className = "status rest reveal";
  statusEl.innerHTML = `<div class="k">今天</div><div class="v">課程都結束囉</div>`;
}else{
  const up = items.find(it=> range(it.t)[0] > nowMin);
  statusEl.className = "status rest reveal";
  statusEl.innerHTML = `<div class="k">下課休息中</div>
    <div class="v"><span class="next-lbl">下一節</span>${up.a.replace("＊","")}</div><div class="t num">${up.t}</div>
    <div class="rem">再 <b class="num">${range(up.t)[0]-nowMin}</b> 分鐘開始</div>`;
}

// ---- 下課通知 ----
let _swReg=null;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r=>{_swReg=r}).catch(()=>{});
const _notifyOk = ()=>{ try{return localStorage.getItem('notify')==='on' && Notification.permission==='granted'}catch(e){return false} };
function sendNotif(title,body){ if(!_notifyOk()) return;
  try{ if(_swReg) _swReg.showNotification(title,{body,tag:title}); else new Notification(title,{body,tag:title}); }catch(e){} }
const _bellBtn=document.getElementById('notifytog');
if(_notifyOk()) _bellBtn.classList.add('on');
_bellBtn.addEventListener('click',async()=>{
  if(_notifyOk()){ try{localStorage.setItem('notify','off')}catch(e){} _bellBtn.classList.remove('on'); return; }
  if(!('Notification' in window)){ alert('此瀏覽器不支援通知'); return; }
  const p=await Notification.requestPermission();
  if(p==='granted'){ try{localStorage.setItem('notify','on')}catch(e){} _bellBtn.classList.add('on');
    sendNotif('通知已開啟','下課時會通知你，16:30 會提醒接小孩'); }
});
// 16:30 接小孩（sessionStorage 防同日重複）
const _p16k='pickup16-'+now.toDateString();
let _pickup16=nowMin>=991||!!sessionStorage.getItem(_p16k);

// 每分鐘偵測狀態變化：跨節／過 19:00 切預覽／隔日切回即時 → reload；同狀態就地更新倒數
// ponytail: reload 最省事（一天觸發沒幾次），同狀態內就地改數字不重繪
const schedKey = m => { const c=items.find(it=>{const[s,e]=range(it.t);return m>=s&&m<e;});
  return c?c.t:(m<dayStart?'before':m>=dayEnd?'after':'break'); };
function stateKey(){
  const d=new Date(), dw=d.getDay(), m=d.getHours()*60+d.getMinutes();
  const lv = dw>=1&&dw<=5 && !holidayEventOn(d) && m<PREVIEW_AFTER;
  if(!lv){ const t=nextSchoolDay(d);
    return 'P'+t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate()); }
  return 'L'+dw+':'+schedKey(m);
}
const sig0 = stateKey();
setInterval(()=>{
  if(document.hidden) return; // 背景頁籤不 reload，交給 visibilitychange 處理
  const d=new Date(), m=d.getHours()*60+d.getMinutes();
  if(stateKey()!==sig0){
    if(current) sendNotif('下課了！',current.a.replace('＊','')+'　下課了');
    try{sessionStorage.setItem("nointro","1");}catch(e){} location.reload(); return; }
  // 16:30 接小孩
  if(m>=990&&!_pickup16){ _pickup16=true; try{sessionStorage.setItem(_p16k,'1')}catch(e){} sendNotif('該接小孩了','16:30 到了，準備出發！'); }
  const tstr=pad(d.getHours())+":"+pad(d.getMinutes());
  const nt=document.querySelector(".nl-time"); if(nt) nt.textContent=tstr;
  const rt2=document.querySelector(".node.now .rtime"); if(rt2) rt2.textContent=tstr;
  if(!live || current) return;
  const rb=statusEl.querySelector(".rem b"); if(!rb) return;
  if(m<dayStart) rb.textContent=dayStart-m;
  else { const up=items.find(it=>range(it.t)[0]>m); if(up) rb.textContent=range(up.t)[0]-m; }
},60000);

// ---- 背景省電：頁籤隱藏停動畫、回來刷新 ----
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(canAnim) stopRunner(); return; }
  if(stateKey()!==sig0){
    if(current) sendNotif('下課了！',current.a.replace('＊','')+'　下課了');
    try{sessionStorage.setItem("nointro","1");}catch(e){} location.reload(); return; }
  if(canAnim && document.querySelector(".node.now .nowrunner")) startRunner();
});

// ---- 完整週課表 ----
let g = "<tr><th></th>" + WEEK.map((w,i)=>
  `<th class="${i===dispDow-1?'today':''}">${w}</th>`).join("") + "</tr>";
ROWS.forEach(([t,cells])=>{
  g += `<tr><td class="time-c num">${t}</td>`;
  if(Array.isArray(cells)){
    g += cells.map((c,i)=>{
      const today = i===dispDow-1 ? "today":"";
      return `<td class="${today}" style="${catStyle(c&&catOf(c))}">${c||""}</td>`;
    }).join("");
  }else{
    g += `<td class="span" colspan="5">${cells}</td>`;
  }
  g += "</tr>";
});
document.getElementById("grid").innerHTML = g;

// ---- 接下來一週行事曆 ----
const cal = document.getElementById("calendar");
const mid = new Date(now.getFullYear(),now.getMonth(),now.getDate());
const weekEnd = new Date(mid.getTime()+7*86400000);
document.getElementById("calrange").textContent = `${md(mid)} – ${md(new Date(weekEnd-86400000))}`;

const within = EVENTS.filter(ev=>{ const s=parse(ev[0]),e=ev[1]?parse(ev[1]):s; return e>=mid && s<weekEnd; });
function evRow(ev){
  const s=parse(ev[0]), holiday=ev[3], tone=ev[4]||"";
  const rng = ev[1] ? `${md(s)}–${md(parse(ev[1]))}` : "";
  return `<div class="ev ${holiday?'holiday':''} ${tone}">
    <div class="d"><div class="dd num">${s.getDate()}</div><div class="wl">週${WL[s.getDay()]}</div>
      ${rng?`<div class="rng2 num">${rng}</div>`:""}</div>
    <div class="txt">${ev[2]}${holiday?'<span class="tag">放假</span>':""}</div></div>`;
}
if(within.length){
  cal.innerHTML = within.map(evRow).join("");
}else{
  const nx = EVENTS.find(ev=> (ev[1]?parse(ev[1]):parse(ev[0]))>=mid);
  cal.innerHTML = `<div class="empty">這一週沒有排定的行事曆活動。</div>` +
    (nx ? `<div class="next reveal">下一個活動　<b class="num">${md(parse(nx[0]))}</b>　${nx[2]}</div>` : "");
}

// ---- 行事曆捲動進場（純 CSS transition，不需 GSAP）----
if("IntersectionObserver" in window){
  const evs=document.querySelectorAll(".cal .ev");
  evs.forEach(el=>el.classList.add("io-hidden"));
  const io=new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("io-hidden");
      e.target.classList.add("io-in"); io.unobserve(e.target); } });
  },{rootMargin:"0px 0px -8% 0px"});
  evs.forEach(el=>io.observe(el));
}
// 內容已就緒，立刻顯示（不等 GSAP）
root.classList.remove("preanim");

// ---- GSAP 載入後才跑的動畫（async，不擋內容）----
function _onGsap(){
  if(!matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
  canAnim = true;
  // now-line 呼吸光暈
  gsap.fromTo(".nl-rail span b",{scale:.6,autoAlpha:.5},
    {scale:2.4,autoAlpha:0,duration:1.8,ease:"sine.out",repeat:-1,repeatDelay:.3,delay:.6});
  // 跑步的馬尾小女孩
  const runner = document.querySelector(".node.now .nowrunner");
  if(runner){
    startRunner();
    const card=runner.closest(".card");
    if(card && "IntersectionObserver" in window){
      new IntersectionObserver(([e])=>{ e.isIntersecting?startRunner():stopRunner(); },
        {rootMargin:"80px 0px"}).observe(card);
    }
  }
}

// ---- 深淺色切換（未點過＝跟隨系統，點過記到 localStorage）----
document.getElementById("themetog").addEventListener("click",()=>{
  const next = root.dataset.theme==="dark" ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("theme", next); }catch(e){}
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" async crossorigin onload="_onGsap()"></script>
