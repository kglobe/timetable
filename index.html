<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>梓琪的課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('preanim')</script>
<style>
  :root{
    --paper:#fbf7f0; --card:#ffffff; --ink:#413b34; --muted:#9a9188;
    --line:#ece5db; --rail:#ddd5c9; --accent:#3b7960; --accent-weak:#e3ede9; /* 木賊色 · 進行中主色 */
    --holiday:#e0a13f; --holiday-weak:#fbf0d8;
    /* 明亮童趣科目色 */
    --c-lang:#d0576b; --c-lang-w:#f7e4e7; /* 今様色 · 語文/社會 */
    --c-math:#2c82be; --c-math-w:#e1eef8; /* 縹色 · 數理 */
    --c-nat:#4ea47b;  --c-nat-w:#e1f0e9;  /* 若竹色 · 自然/體育 */
    --c-art:#e0902d;  --c-art-w:#fbecd2;  /* 柑子色 · 藝術 */
    --shadow:0 1px 2px rgba(75,70,65,.04),0 8px 22px rgba(75,70,65,.07);
    --shadow-lift:0 2px 8px rgba(64,91,85,.18),0 14px 30px rgba(75,70,65,.13);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#24211d; --card:#2c2823; --ink:#ece5d9; --muted:#a89f92;
      --line:#39332c; --rail:#463f37; --accent:#86b0a5; --accent-weak:#2b3733;
      --holiday:#e6b25c; --holiday-weak:#352a1a;
      --c-lang:#e88a99; --c-lang-w:#3a2a2d;
      --c-math:#79b3e0; --c-math-w:#24303a;
      --c-nat:#82c187;  --c-nat-w:#263320;
      --c-art:#eab662;  --c-art-w:#362d1c;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32);
      --shadow-lift:0 2px 8px rgba(134,176,165,.16),0 14px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 56px}
  .preanim .reveal{opacity:0}

  /* ---- header ---- */
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;
    color:var(--accent);margin:0 0 8px}
  h1{font-size:29px;font-weight:700;margin:0;letter-spacing:.01em}
  h1 .who{color:var(--accent)}
  .datebar{display:flex;align-items:center;gap:9px;margin-top:8px;color:var(--muted);font-size:15px}
  .datebar .num{font-size:16px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    letter-spacing:.14em;color:var(--accent);margin-left:auto}
  .live .ring{position:relative;width:9px;height:9px}
  .live .ring i{position:absolute;inset:0;border-radius:50%;background:var(--accent)}
  .live .ring b{position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent)}

  /* ---- status ---- */
  .status{margin:22px 0 16px;padding:16px 18px;border-radius:9px;background:var(--card);
    box-shadow:var(--shadow);border:1px solid var(--line)}
  .status .k{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
  .status .v{font-size:20px;font-weight:600}
  .status .t{color:var(--accent);font-size:15px;margin-top:4px}
  .status.rest .v{color:var(--muted);font-weight:500}
  .status .next-lbl{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-weak);
    padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:middle;letter-spacing:.05em}

  /* ---- legend ---- */
  .legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:0 2px 22px;
    font-size:13px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%}

  /* ---- timeline ---- */
  .tl{position:relative}
  .node{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;padding:7px 0}
  .rail{position:relative;display:flex;justify-content:center}
  .rail::before{content:"";position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--rail)}
  .node:first-child .rail::before{top:14px}
  .node:last-child .rail::before{bottom:calc(100% - 14px)}
  .dot{position:relative;z-index:1;width:11px;height:11px;border-radius:50%;
    background:var(--c,var(--rail));margin-top:15px;box-shadow:0 0 0 4px var(--paper)}
  .node.fixed .dot{width:7px;height:7px;margin-top:17px;background:var(--rail)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:12px 15px;box-shadow:inset 3px 0 0 var(--c,transparent),var(--shadow);
    display:flex;align-items:baseline;gap:12px}
  .node.fixed .card{background:transparent;border-color:transparent;box-shadow:none;padding:11px 15px}
  .time{flex:0 0 auto;font-size:16px;font-weight:600;color:var(--ink)}
  .time .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
  .node.fixed .time{color:var(--muted);font-weight:500}
  .name{font-size:17px;font-weight:600}
  .node.fixed .name{font-size:16px;font-weight:400;color:var(--muted)}
  .name .star{color:var(--accent);font-weight:700}
  .chip{margin-left:auto;align-self:center;flex:0 0 auto;font-size:12px;font-weight:600;
    color:var(--c);background:var(--cw);padding:2px 9px;border-radius:999px;letter-spacing:.02em}

  /* current class */
  .node.now .dot{background:var(--accent);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--accent-weak)}
  .node.now .card{box-shadow:inset 3px 0 0 var(--accent),var(--shadow-lift)}
  .node.now .time,.node.now .name{color:var(--accent)}
  /* now line */
  .nowline{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;
    align-items:center;padding:9px 0;margin:1px 0}
  .nl-rail{position:relative;display:flex;justify-content:center}
  .nl-rail span{width:13px;height:13px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--accent-weak)}
  .nl-body{display:flex;align-items:center;gap:10px}
  .nl-time{font-size:15px;font-weight:700;color:var(--accent)}
  .nl-label{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent)}
  .nl-rule{flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent);
    transform-origin:left center}
  /* 活線：正上課時，串起「進行中」卡片與「現在」節點 */
  .nl-connect{position:absolute;left:50%;margin-left:-4px;bottom:50%;
    width:8px;height:42px;overflow:visible;pointer-events:none}

  /* ---- weekly grid ---- */
  .more{margin-top:26px;border-top:1px solid var(--line);padding-top:6px}
  summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    padding:10px 2px;font-size:15px;font-weight:600;color:var(--ink);user-select:none}
  summary::-webkit-details-marker{display:none}
  .chev{width:16px;height:16px;color:var(--accent);transition:transform .25s ease}
  details[open] .chev{transform:rotate(90deg)}
  .grid-note{font-size:13px;color:var(--muted);margin:6px 0 12px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
  table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:500px;width:100%}
  th,td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em}
  td{color:var(--c,var(--ink));font-weight:500}
  td.time-c{color:var(--muted);text-align:left;font-weight:400}
  th.today{color:var(--accent)}
  td.today{box-shadow:inset 0 0 0 999px var(--accent-weak)}
  tr:last-child td{border-bottom:none}

  /* ---- calendar ---- */
  .cal{margin-top:34px}
  .cal-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .cal-head h2{font-size:19px;font-weight:700;margin:0}
  .cal-head .rng{font-size:13px;color:var(--muted)}
  .cal-sub{font-size:14px;color:var(--muted);margin:0 0 14px}
  .ev{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:none}
  .ev .d{text-align:center}
  .ev .d .dd{font-size:25px;font-weight:700;line-height:1}
  .ev .d .wl{font-size:12px;color:var(--muted);margin-top:3px}
  .ev .rng2{font-size:12px;color:var(--muted);margin-top:2px}
  .ev .txt{align-self:center;font-size:16px;font-weight:500}
  .ev.holiday .d .dd{color:var(--holiday)}
  .ev.holiday .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--holiday);
    background:var(--holiday-weak);padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .empty{color:var(--muted);font-size:16px;padding:8px 0}
  .next{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px}
  .next b{color:var(--accent)}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;line-height:1.7}
  /* ---- 進度條 · 剩餘時間 ---- */
  .status .bar{height:5px;border-radius:999px;background:var(--accent-weak);margin-top:11px;overflow:hidden}
  .status .bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transform-origin:left center}
  .status .rem{color:var(--muted);font-size:13.5px;margin-top:8px}
  .status .rem b{color:var(--accent);font-weight:700}
  .node.now .card{position:relative}
  .node.now .prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--accent-weak);
    border-radius:0 0 8px 8px;overflow:hidden}
  .node.now .prog i{position:relative;display:block;height:100%;background:var(--accent);
    transform-origin:left center;overflow:hidden}
  .node.now .prog i u{position:absolute;top:0;bottom:0;left:0;width:38%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
  .node.now .nowglow{position:absolute;inset:0;border-radius:8px;pointer-events:none;
    box-shadow:0 0 0 3px var(--accent-weak);opacity:0}
  @media (prefers-reduced-motion:no-preference){
    .node.now .nowglow{animation:nowbreath 3.4s ease-in-out infinite}
  }
  @keyframes nowbreath{0%,100%{opacity:0}50%{opacity:1}}

  /* ---- now-line 呼吸光暈 ---- */
  .nl-rail span{position:relative}
  .nl-rail span b{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}

  /* ---- 行事曆捲動進場 ---- */
  .io-hidden{opacity:0;transform:translateY(16px)}
  .io-in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  @media (max-width:360px){h1{font-size:25px}.wrap{padding:22px 14px 48px}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow reveal">暑假課後班 · 生活營</p>
    <h1 class="reveal"><span class="who">梓琪</span>的今日課表</h1>
    <div class="datebar reveal">
      <span class="num" id="today"></span>
      <span class="live" id="livewrap" hidden><span class="ring"><b></b><i></i></span>LIVE</span>
    </div>
  </header>

  <section class="status reveal" id="status"></section>

  <div class="legend reveal">
    <span><i style="background:var(--c-lang)"></i>語文 · 社會</span>
    <span><i style="background:var(--c-math)"></i>數理</span>
    <span><i style="background:var(--c-nat)"></i>自然 · 體育</span>
    <span><i style="background:var(--c-art)"></i>藝術</span>
  </div>

  <div class="tl" id="timeline"></div>

  <details class="more reveal">
    <summary>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      完整一週課表
    </summary>
    <p class="grid-note">＊拼音練習：週一、三、五上午；自然生態：週四下午。</p>
    <div class="scroll"><table id="grid"></table></div>
  </details>

  <section class="cal reveal">
    <div class="cal-head"><h2>接下來一週</h2><span class="rng" id="calrange"></span></div>
    <p class="cal-sub">鎮昌國小 115 學年度第 1 學期行事曆</p>
    <div id="calendar"></div>
  </section>

  <footer>
    資料來源：暑假課後班課程表 ＋ 鎮昌國小 115 學年度第 1 學期行事曆<br>
    週一至週五上課，週六日休息。
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ---- 課程資料 ----
const COURSE_TIMES = ["09:00–09:50","10:00–10:50","11:00–11:50","14:00–14:50","15:00–15:50","16:30–17:20"];
const WEEK = ["星期一","星期二","星期三","星期四","星期五"];
const COURSES = [
  ["拼音練習＊","認識時鐘","拼音練習＊","數字遊戲","拼音練習＊"],
  ["拼音練習＊","愛塗鴉","拼音練習＊","筆順練習","拼音練習＊"],
  ["專注力遊戲","筆順練習","影片欣賞","口語表達","繪本引導"],
  ["昆蟲 Life 秀","創意 DIY","團康遊戲","自然生態＊","唱跳音符"],
  ["認識校園","品格生活","生活知能","安全教育","益智遊戲"],
  ["團隊活動","體能活動","角落活動","球類活動","戶外遊戲"],
];
const FIXED = [
  ["07:30–08:00","互道早安、歡喜上學（到校）"],
  ["08:00–08:50","晨間運動"],
  ["12:00–12:40","午餐"],
  ["12:40–13:50","午睡"],
  ["16:00–16:20","點心時間"],
  ["17:30–18:00","打掃環境、等家長接回"],
];
// ---- 科目分類 ----
const CAT = {lang:"語文",math:"數理",nat:"自然",art:"藝術"};
const COURSE_CAT = {
  "拼音練習":"lang","筆順練習":"lang","口語表達":"lang","繪本引導":"lang",
  "品格生活":"lang","生活知能":"lang","安全教育":"lang",
  "認識時鐘":"math","數字遊戲":"math","專注力遊戲":"math","益智遊戲":"math",
  "昆蟲 Life 秀":"nat","自然生態":"nat","團康遊戲":"nat",
  "體能活動":"nat","球類活動":"nat","戶外遊戲":"nat","認識校園":"nat",
  "團隊活動":"lang",
  "愛塗鴉":"art","影片欣賞":"art","創意 DIY":"art","唱跳音符":"art","角落活動":"art",
};
// 與語文同色、但 chip 標籤要另外顯示的科目
const SUBJECT = {"團隊活動":"社會","品格生活":"社會","生活知能":"社會","安全教育":"社會"};
const catOf = n => COURSE_CAT[n.replace("＊","")] || null;
const catStyle = c => c ? `--c:var(--c-${c});--cw:var(--c-${c}-w)` : "";
// ---- 行事曆（115 學年=2026；1 月屬 2027）----
const EVENTS = [
  ["2026-08-31",null,"開學日・新生始業典禮・課後照顧班正式上課",false],
  ["2026-09-09",null,"國民體育日",false],
  ["2026-09-16",null,"地震避難演練及校園人為災害演練",false],
  ["2026-09-21",null,"國家防災日",false],
  ["2026-09-23",null,"牙齒檢查 (1)",false],
  ["2026-09-25",null,"中秋節放假 1 天",true],
  ["2026-09-28",null,"教師節放假 1 天",true],
  ["2026-09-30",null,"牙齒檢查 (2)",false],
  ["2026-10-01",null,"舉辦班親會",false],
  ["2026-10-09",null,"國慶日補假 1 天",true],
  ["2026-10-16",null,"親職教育講座",false],
  ["2026-10-20","2026-10-22","國小體促會躲避球賽（暫定）",false],
  ["2026-10-23",null,"第一次學生週會",false],
  ["2026-10-26",null,"臺灣光復暨金門古寧頭大捷紀念日補假 1 天",true],
  ["2026-11-02","2026-11-06","第 1 次定期評量週（期中考）",false],
  ["2026-12-05",null,"運動會",false],
  ["2026-12-07",null,"運動會補休",true],
  ["2026-12-11",null,"親職教育講座",false],
  ["2026-12-18",null,"第二次學生週會",false],
  ["2026-12-25",null,"行憲紀念日放假 1 天",true],
  ["2027-01-01",null,"開國紀念日放假 1 天",true],
  ["2027-01-11","2027-01-15","第 2 次定期評量週（期末考）",false],
  ["2027-01-19",null,"跳蚤市場（資源回收及理財教育）",false],
  ["2027-01-20",null,"第一學期課程結束",false],
];

const WL = ["日","一","二","三","四","五","六"];
const pad = n => String(n).padStart(2,"0");
const toMin = h => { const [a,b]=h.split(":").map(Number); return a*60+b; };
const range = t => { const [a,b]=t.split("–"); return [toMin(a),toMin(b)]; };
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const md = dt => `${pad(dt.getMonth()+1)}/${pad(dt.getDate())}`;

const now = new Date();
const dow = now.getDay();
const nowMin = now.getHours()*60 + now.getMinutes();
const isWeekday = dow>=1 && dow<=5;
const root = document.documentElement;
const canAnim = !!window.gsap && matchMedia("(prefers-reduced-motion: no-preference)").matches;

// 平日 19:00 前顯示當天（即時狀態）；之後或週末改預覽下個上課日
const PREVIEW_AFTER = 19*60;
const live = isWeekday && nowMin < PREVIEW_AFTER;
const disp = new Date(now);
if(!live){ do{ disp.setDate(disp.getDate()+1); }while(disp.getDay()===0||disp.getDay()===6); }
const dispDow = disp.getDay();
const hd = live ? now : disp;

document.getElementById("today").textContent =
  `${hd.getFullYear()} / ${pad(hd.getMonth()+1)} / ${pad(hd.getDate())}　週${WL[hd.getDay()]}${live?'':'　·　預覽'}`;

// ---- 今日課表 ----
const tl = document.getElementById("timeline");
const statusEl = document.getElementById("status");
const liveWrap = document.getElementById("livewrap");

const col = dispDow-1;
let items = FIXED.map(f=>({t:f[0],a:f[1],fixed:true}));
COURSE_TIMES.forEach((t,i)=> items.push({t,a:COURSES[i][col],fixed:false}));
items.sort((x,y)=> range(x.t)[0]-range(y.t)[0]);

const current = live ? items.find(it=>{ const [s,e]=range(it.t); return nowMin>=s && nowMin<e; }) : null;
const dayStart = range(items[0].t)[0];
const dayEnd = range(items[items.length-1].t)[1];
const inSession = live && nowMin>=dayStart && nowMin<dayEnd;
const insertBefore = items.findIndex(it=> range(it.t)[0] > nowMin);

const pct = (s,e)=> Math.min(100,Math.max(0,(nowMin-s)/(e-s)*100));

const connectHTML = current
  ? `<svg class="nl-connect" viewBox="0 0 8 42" preserveAspectRatio="none" aria-hidden="true">
      <line x1="4" y1="0" x2="4" y2="42" stroke="var(--accent)" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="3 6"/></svg>`
  : "";
const nowLineHTML = `<div class="nowline reveal" id="nowline">
  <div class="nl-rail">${connectHTML}<span><b></b></span></div>
  <div class="nl-body"><span class="nl-time num">${pad(now.getHours())}:${pad(now.getMinutes())}</span>
  <span class="nl-label">現在</span><span class="nl-rule" id="nlrule"></span></div></div>`;

let out = "";
items.forEach((it,idx)=>{
  if(inSession && idx===insertBefore) out += nowLineHTML;
  const [start,end]=it.t.split("–");
  const on = current===it;
  const cat = it.fixed ? null : catOf(it.a);
  const name = it.a.replace("＊",'<span class="star">＊</span>');
  const chip = cat ? `<span class="chip">${SUBJECT[it.a.replace("＊","")]||CAT[cat]}</span>` : "";
  const [cs,ce]=range(it.t);
  const prog = on ? `<div class="prog"><i style="width:${pct(cs,ce)}%"><u></u></i></div><span class="nowglow"></span>` : "";
  out += `<div class="node reveal ${it.fixed?'fixed':''} ${on?'now':''}" style="${catStyle(cat)}">
    <div class="rail"><span class="dot"></span></div>
    <div class="card">
      <div class="time num">${start}<span class="sub">${end}</span></div>
      <div class="name">${name}</div>${chip}${prog}
    </div></div>`;
});
if(inSession && insertBefore===-1) out += nowLineHTML;
tl.innerHTML = out;

liveWrap.hidden = !inSession;
if(current){
  const [cs,ce]=range(current.t);
  statusEl.innerHTML = `<div class="k">現在進行</div>
    <div class="v">${current.a.replace("＊","")}</div><div class="t num">${current.t}</div>
    <div class="bar"><i style="width:${pct(cs,ce)}%"></i></div>
    <div class="rem">還有 <b class="num">${ce-nowMin}</b> 分鐘下課</div>`;
  // 每 30 秒更新剩餘時間與進度條（ponytail: 跨節不即時重繪，換節靠下次載入）
  setInterval(()=>{
    const d=new Date(), m=d.getHours()*60+d.getMinutes();
    if(m<cs||m>=ce) return;
    const p=Math.min(100,Math.max(0,(m-cs)/(ce-cs)*100));
    const sb=statusEl.querySelector(".bar i"); if(sb) sb.style.width=p+"%";
    const rb=statusEl.querySelector(".rem b"); if(rb) rb.textContent=ce-m;
    const cb=document.querySelector(".node.now .prog i"); if(cb) cb.style.width=p+"%";
  },30000);
}else if(!live){
  const diff = Math.round((new Date(disp.getFullYear(),disp.getMonth(),disp.getDate())
    - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  statusEl.className = "status rest reveal";
  statusEl.innerHTML = `<div class="k">${diff===1?'明天課表':'週'+WL[dispDow]+'課表'}</div>
    <div class="v">${items[0].a.replace("＊","")}</div><div class="t num">第一節 ${items[0].t}</div>`;
}else if(nowMin < dayStart){
  statusEl.innerHTML = `<div class="k">今天還沒開始</div>
    <div class="v">${items[0].a.replace("＊","")}</div><div class="t num">第一節 ${items[0].t}</div>
    <div class="rem">再 <b class="num">${dayStart-nowMin}</b> 分鐘開始</div>`;
}else if(nowMin >= dayEnd){
  statusEl.className = "status rest reveal";
  statusEl.innerHTML = `<div class="k">今天</div><div class="v">課程都結束囉</div>`;
}else{
  const up = items.find(it=> range(it.t)[0] > nowMin);
  statusEl.className = "status rest reveal";
  statusEl.innerHTML = `<div class="k">下課休息中</div>
    <div class="v"><span class="next-lbl">下一節</span>${up.a.replace("＊","")}</div><div class="t num">${up.t}</div>
    <div class="rem">再 <b class="num">${range(up.t)[0]-nowMin}</b> 分鐘開始</div>`;
}

// 每分鐘偵測狀態變化：跨節／過 19:00 切預覽／隔日切回即時 → reload；同狀態就地更新倒數
// ponytail: reload 最省事（一天觸發沒幾次），同狀態內就地改數字不重繪
const schedKey = m => { const c=items.find(it=>{const[s,e]=range(it.t);return m>=s&&m<e;});
  return c?c.t:(m<dayStart?'before':m>=dayEnd?'after':'break'); };
function stateKey(){
  const d=new Date(), dw=d.getDay(), m=d.getHours()*60+d.getMinutes();
  const lv = dw>=1&&dw<=5 && m<PREVIEW_AFTER;
  if(!lv){ const t=new Date(d); do{t.setDate(t.getDate()+1);}while(t.getDay()===0||t.getDay()===6);
    return 'P'+t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate()); }
  return 'L'+dw+':'+schedKey(m);
}
const sig0 = stateKey();
setInterval(()=>{
  const d=new Date(), m=d.getHours()*60+d.getMinutes();
  if(stateKey()!==sig0){ location.reload(); return; }
  const nt=document.querySelector(".nl-time"); if(nt) nt.textContent=pad(d.getHours())+":"+pad(d.getMinutes());
  if(!live || current) return;
  const rb=statusEl.querySelector(".rem b"); if(!rb) return;
  if(m<dayStart) rb.textContent=dayStart-m;
  else { const up=items.find(it=>range(it.t)[0]>m); if(up) rb.textContent=range(up.t)[0]-m; }
},60000);

// ---- 完整週課表 ----
let g = "<tr><th></th>" + WEEK.map((w,i)=>
  `<th class="${isWeekday&&i===dow-1?'today':''}">${w}</th>`).join("") + "</tr>";
COURSE_TIMES.forEach((t,r)=>{
  g += `<tr><td class="time-c num">${t}</td>` + COURSES[r].map((c,i)=>{
    const cat = catOf(c);
    const today = isWeekday&&i===dow-1 ? "today":"";
    return `<td class="${today}" style="${catStyle(cat)}">${c}</td>`;
  }).join("") + "</tr>";
});
document.getElementById("grid").innerHTML = g;

// ---- 接下來一週行事曆 ----
const cal = document.getElementById("calendar");
const mid = new Date(now.getFullYear(),now.getMonth(),now.getDate());
const weekEnd = new Date(mid.getTime()+7*86400000);
document.getElementById("calrange").textContent = `${md(mid)} – ${md(new Date(weekEnd-86400000))}`;

const within = EVENTS.filter(ev=>{ const s=parse(ev[0]),e=ev[1]?parse(ev[1]):s; return e>=mid && s<weekEnd; });
function evRow(ev){
  const s=parse(ev[0]), holiday=ev[3];
  const rng = ev[1] ? `${md(s)}–${md(parse(ev[1]))}` : "";
  return `<div class="ev ${holiday?'holiday':''}">
    <div class="d"><div class="dd num">${s.getDate()}</div><div class="wl">週${WL[s.getDay()]}</div>
      ${rng?`<div class="rng2 num">${rng}</div>`:""}</div>
    <div class="txt">${ev[2]}${holiday?'<span class="tag">放假</span>':""}</div></div>`;
}
if(within.length){
  cal.innerHTML = within.map(evRow).join("");
}else{
  const nx = EVENTS.find(ev=> (ev[1]?parse(ev[1]):parse(ev[0]))>=mid);
  cal.innerHTML = `<div class="empty">這一週沒有排定的行事曆活動。</div>` +
    (nx ? `<div class="next reveal">下一個活動　<b class="num">${md(parse(nx[0]))}</b>　${nx[2]}</div>` : "");
}

// ---- 動畫（GSAP 失敗或偏好減少動態時，內容照樣完整顯示）----
if(canAnim){
  gsap.set(".reveal",{autoAlpha:0,y:14});
  gsap.set("#nowline",{autoAlpha:0,y:0});
  const t = gsap.timeline({defaults:{ease:"power2.out"}});
  t.to("header .reveal",{autoAlpha:1,y:0,duration:.5,stagger:.07})
   .to(".status, .legend",{autoAlpha:1,y:0,duration:.5,stagger:.08},"-=.25")
   .to(".node",{autoAlpha:1,y:0,duration:.45,stagger:.045},"-=.1")
   .to("#nowline",{autoAlpha:1,duration:.3},"-=.45")
   .to(".more, .cal, .cal .next",{autoAlpha:1,y:0,duration:.5,stagger:.06},"-=.2")
   .set(".reveal, #nowline",{autoAlpha:1,y:0}); // 保底：任何漏網 reveal 都顯示
  const rule = document.getElementById("nlrule");
  if(rule){
    t.from("#nowline .nl-rail span",{scale:0,duration:.5,ease:"back.out(2)"},"-=.55")
     .from(rule,{scaleX:0,duration:.7,ease:"power3.out"},"-=.5");
  }
  gsap.fromTo(".node.now .card",{scale:.985},{scale:1,duration:.6,delay:.5,ease:"power2.out"});
  gsap.from(".status .bar i, .node.now .prog i",{scaleX:0,duration:.9,delay:.55,ease:"power2.out"});
  gsap.to(".live .ring b",{scale:2.4,autoAlpha:0,duration:1.6,ease:"sine.out",repeat:-1,repeatDelay:.2});
  // now-line 呼吸光暈
  gsap.fromTo(".nl-rail span b",{scale:.6,autoAlpha:.5},
    {scale:2.4,autoAlpha:0,duration:1.8,ease:"sine.out",repeat:-1,repeatDelay:.3,delay:.6});
  // 進度流光（ambient 層，reduced-motion 時不啟用）
  gsap.fromTo(".node.now .prog i u",{xPercent:-120},
    {xPercent:340,duration:2.4,ease:"sine.inOut",repeat:-1,repeatDelay:.5,delay:.8});
  // 活線：自繪一次（scaleY 由卡片端往下畫）＋ 虛線持續流動
  const cnx = document.querySelector(".nl-connect");
  if(cnx){
    gsap.from(cnx,{scaleY:0,transformOrigin:"50% 0%",duration:.55,ease:"power2.out",delay:.7});
    gsap.to(cnx.querySelector("line"),{strokeDashoffset:-9,duration:1.1,ease:"none",repeat:-1});
  }
  // 行事曆捲動進場
  if("IntersectionObserver" in window){
    const evs=document.querySelectorAll(".cal .ev");
    evs.forEach(el=>el.classList.add("io-hidden"));
    const io=new IntersectionObserver((ents)=>{
      ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("io-hidden");
        e.target.classList.add("io-in"); io.unobserve(e.target); } });
    },{rootMargin:"0px 0px -8% 0px"});
    evs.forEach(el=>io.observe(el));
  }
}
root.classList.remove("preanim");
</script>
