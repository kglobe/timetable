name: Fetch lunch menu
on:
  schedule:
    - cron: '0 22 * * 0-4'   # UTC 22:00 (Mon-Fri 06:00 TST), covers current week
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch week menu
        run: node scripts/fetch-lunch.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunch.json
          git diff --cached --quiet || git commit -m "chore: update lunch menu" && git push
