<!DOCTYPE html>
<html lang="zh-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24211d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>梓琪的校園資訊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=_t;}catch(e){document.documentElement.dataset.theme='light';}</script>
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('preanim')</script>
<style>
  :root{
    --paper:#fbf7f0; --card:#ffffff; --ink:#413b34; --muted:#7a7067;
    --line:#ece5db; --rail:#ddd5c9; --accent:#39755d; --accent-weak:#e3ede9;
    --holiday:#ab3b3a; --holiday-weak:#f7e3e2;
    --c-lang:#d0576b; --c-lang-w:#f7e4e7; --c-lang-t:#be354c;
    --c-math:#2c82be; --c-math-w:#e1eef8; --c-math-t:#2670a4;
    --c-nat:#4ea47b;  --c-nat-w:#e1f0e9; --c-nat-t:#39775a;
    --c-art:#e0902d;  --c-art-w:#fbecd2; --c-art-t:#995f17;
    --shadow:0 1px 2px rgba(75,70,65,.04),0 8px 22px rgba(75,70,65,.07);
    --shadow-lift:0 2px 8px rgba(64,91,85,.18),0 14px 30px rgba(75,70,65,.13);
  }
  :root[data-theme="dark"]{
      --paper:#24211d; --card:#2c2823; --ink:#ece5d9; --muted:#a89f92;
      --line:#39332c; --rail:#463f37; --accent:#86b0a5; --accent-weak:#2b3733;
      --holiday:#d97b79; --holiday-weak:#3a2523;
      --c-lang:#e88a99; --c-lang-w:#3a2a2d; --c-lang-t:#e88a99;
      --c-math:#79b3e0; --c-math-w:#24303a; --c-math-t:#79b3e0;
      --c-nat:#82c187;  --c-nat-w:#263320; --c-nat-t:#82c187;
      --c-art:#eab662;  --c-art-w:#362d1c; --c-art-t:#eab662;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32);
      --shadow-lift:0 2px 8px rgba(134,176,165,.16),0 14px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{touch-action:manipulation}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background .3s ease,color .3s ease}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 56px}
  .preanim .reveal{opacity:0}

  /* ---- header ---- */
  header{position:relative}
  .themetog{position:absolute;top:-2px;right:-2px;width:35px;height:35px;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;
    background:var(--card);color:var(--muted);cursor:pointer;box-shadow:var(--shadow);
    -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
  .themetog:hover{color:var(--accent)}
  .themetog:active{color:var(--accent);background:var(--accent-weak)}
  .themetog .ic{width:22px;height:22px}
  .themetog .ic-moon{display:none}
  :root[data-theme="dark"] .themetog .ic-sun{display:none}
  :root[data-theme="dark"] .themetog .ic-moon{display:block}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;
    color:var(--muted);text-decoration:none;margin-bottom:10px;letter-spacing:.04em;
    transition:color .2s}
  .back:hover{color:var(--accent)}
  .back svg{width:14px;height:14px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--accent);margin:0 0 8px}
  h1{font-size:29px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
  h1 .who{color:var(--accent)}

  /* ---- countdown hero ---- */
  .count{margin:22px 0 26px;padding:22px 20px 20px;border-radius:9px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .count .k{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .count .big{display:flex;align-items:baseline;gap:10px;margin-top:2px}
  .count .dd{font-size:64px;font-weight:700;line-height:1.05;color:var(--accent)}
  .count .unit{font-size:17px;font-weight:600;color:var(--ink)}
  .count .date{font-size:14px;color:var(--muted);margin-top:6px}
  .count .date b{color:var(--ink);font-weight:600}
  .count .girl{position:absolute;right:16px;bottom:12px;width:46px;overflow:visible;
    filter:drop-shadow(0 1px 1.5px rgba(59,121,96,.25))}
  /* 開學當天／已開學 */
  .count.today .dd{font-size:34px;line-height:1.2}

  /* ---- class card ---- */
  .cls{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow);
    margin-bottom:30px}
  .cls>div{background:var(--card);padding:14px 16px}
  .cls .k{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
  .cls .v{font-size:19px;font-weight:700}
  .cls .v .u{font-size:13px;font-weight:500;color:var(--muted);margin:0 2px}

  /* ---- sections ---- */
  h2{font-size:19px;font-weight:700;margin:0 0 4px}
  .sub{font-size:14px;color:var(--muted);margin:0 0 14px}
  section{margin-bottom:34px}

  /* ---- textbook list ---- */
  .books{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .bk{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
    box-shadow:inset 3px 0 0 var(--c,var(--rail)),var(--shadow)}
  .bk .s{font-size:15px;font-weight:700}
  .bk .p{font-size:13.5px;color:var(--muted);margin-top:1px}
  .bk .p b{color:var(--c,var(--ink));font-weight:600}


  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;line-height:1.7}
  footer a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  @media (max-width:360px){h1{font-size:25px}.wrap{padding:22px 14px 48px}.books{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <button class="themetog" id="themetog" type="button" aria-label="切換深色／淺色">
      <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="back reveal" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>回課表
    </a>
    <p class="eyebrow reveal">鎮昌國小 · 115 學年度</p>
    <h1 class="reveal"><span class="who">梓琪</span>的校園資訊</h1>
  </header>

  <div class="count reveal" id="count"></div>

  <div class="cls reveal">
    <div><div class="k">班級</div><div class="v num">1<span class="u">年</span>3<span class="u">班</span></div></div>
    <div><div class="k">導師</div><div class="v">謝懿雯</div></div>
  </div>

  <section class="reveal">
    <h2>一年級教科書版本</h2>
    <p class="sub">115 學年度上學期，學校公告的選用版本。</p>
    <div class="books">
      <div class="bk" style="--c:var(--c-lang)"><div class="s">國語</div><div class="p"><b>翰林</b></div></div>
      <div class="bk" style="--c:var(--c-lang)"><div class="s">臺灣台語</div><div class="p"><b>康軒</b></div></div>
      <div class="bk" style="--c:var(--c-math)"><div class="s">數學</div><div class="p"><b>康軒</b></div></div>
      <div class="bk" style="--c:var(--c-nat)"><div class="s">生活課程</div><div class="p"><b>翰林</b></div></div>
      <div class="bk" style="--c:var(--c-nat)"><div class="s">健康與體育</div><div class="p"><b>翰林</b></div></div>
    </div>
  </section>

  <footer>
    資料來源：鎮昌國小首頁公告與 115 學年度第 1 學期行事曆<br>
    <a href="index.html">回到每日課表</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const root=document.documentElement;
const canAnim=!!window.gsap && matchMedia("(prefers-reduced-motion: no-preference)").matches;

// ---- 開學倒數 ----
const OPEN=new Date(2026,7,31); // 2026-08-31
const now=new Date();
const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const days=Math.round((OPEN-today)/86400000);
const cd=document.getElementById("count");
if(days>0){
  cd.innerHTML=`<div class="k">距離開學還有</div>
    <div class="big"><span class="dd num" id="dd">${days}</span><span class="unit">天</span></div>
    <div class="date">開學日　<b class="num">8 / 31</b>（週一）</div>
    <svg class="girl" viewBox="0 0 40 44" fill="none" stroke="var(--accent)" stroke-width="4.6"
      stroke-linecap="round" aria-hidden="true">
      <ellipse class="shadow" cx="20" cy="43" rx="9" ry="1.5" fill="var(--accent)" stroke="none" opacity=".16"/>
      <path class="pony" d="M15 8 C 11 5,8 10,10 17"/>
      <path class="leg-b" d="M19 29 L12 41"/><path class="arm-b" d="M20 18 L12 23"/>
      <line class="body" x1="21" y1="14" x2="19" y2="29"/>
      <circle class="head" cx="21" cy="9" r="6.4" fill="var(--accent)" stroke="none"/>
      <circle class="tie" cx="15" cy="8" r="1.5" fill="#f0c050" stroke="none"/>
      <path class="arm-f" d="M20 18 L28 22"/><path class="leg-f" d="M19 29 L27 40"/></svg>`;
}else{
  cd.remove();
}

// ---- 進場動畫（與 index.html 同節奏；女孩原地小跑步）----
if(canAnim){
  gsap.set(".reveal",{autoAlpha:0,y:14});
  gsap.timeline({defaults:{ease:"power2.out"}})
    .to("header .reveal",{autoAlpha:1,y:0,duration:.5,stagger:.07})
    .to(".count, .cls",{autoAlpha:1,y:0,duration:.5,stagger:.09},"-=.25")
    .to("section.reveal",{autoAlpha:1,y:0,duration:.5,stagger:.09},"-=.2")
    .set(".reveal",{autoAlpha:1,y:0});
  const dd=document.getElementById("dd");
  if(dd){
    const n=+dd.textContent, o={v:0};
    gsap.to(o,{v:n,duration:1.1,delay:.35,ease:"power2.out",onUpdate:()=>dd.textContent=Math.round(o.v)});
  }
  const g=".count .girl";
  if(document.querySelector(g)){
    const parts=[g,`${g} .leg-f`,`${g} .leg-b`,`${g} .arm-f`,`${g} .arm-b`,`${g} .pony`,`${g} .tie`,`${g} .shadow`];
    const sw=16,d=.26,bob=2.5;
    const L={duration:d,ease:"sine.inOut",repeat:-1,yoyo:true};
    const startRun=()=>{
      gsap.to(g,{rotation:2,svgOrigin:"20 40",duration:.4,ease:"power2.out"});
      gsap.fromTo(`${g} .leg-f`,{rotation:-sw},{rotation:sw*.85,svgOrigin:"19 29",...L});
      gsap.fromTo(`${g} .leg-b`,{rotation:sw*.85},{rotation:-sw,svgOrigin:"19 29",...L});
      gsap.fromTo(`${g} .arm-f`,{rotation:sw+2},{rotation:-sw-2,svgOrigin:"20 18",...L});
      gsap.fromTo(`${g} .arm-b`,{rotation:-sw-2},{rotation:sw+2,svgOrigin:"20 18",...L});
      gsap.to(g,{y:-bob,...L});
      gsap.fromTo(`${g} .pony, ${g} .tie`,{rotation:-10},{rotation:18,svgOrigin:"15 8",...L,duration:d*1.3});
      gsap.fromTo(`${g} .shadow`,{scaleX:.7,opacity:.10},{scaleX:1,opacity:.22,svgOrigin:"20 43",...L});
    };
    // 體操旋轉跳：passé 抬腳 → 逐格轉一圈 → bounce 落地
    const PIRO=[
      // 0: 正面 passé（單腳站、另腳提膝、雙手上舉）
      `<ellipse cx="20" cy="43" rx="5" ry="1.2" fill="var(--accent)" stroke="none" opacity=".10"/>
       <path d="M15 8 C 11 5,8 10,10 16"/><line x1="20" y1="14" x2="20" y2="29"/>
       <path d="M20 29 L20 41"/><path d="M20 29 L27 25"/>
       <path d="M20 18 L14 10"/><path d="M20 18 L26 10"/>
       <circle cx="20" cy="9" r="6.2" fill="var(--accent)" stroke="none"/>
       <circle cx="15" cy="8" r="1.5" fill="#f0c050" stroke="none"/>`,
      // 1: 側面（身體窄）
      `<ellipse cx="20" cy="43" rx="3" ry="1" fill="var(--accent)" stroke="none" opacity=".06"/>
       <line x1="20" y1="14" x2="20" y2="29"/><path d="M20 29 L20 41"/><path d="M20 29 L23 26"/>
       <path d="M20 18 L20 10"/>
       <circle cx="20" cy="9" r="5.4" fill="var(--accent)" stroke="none"/>`,
      // 2: 背面（馬尾反向）
      `<ellipse cx="20" cy="43" rx="5" ry="1.2" fill="var(--accent)" stroke="none" opacity=".10"/>
       <path d="M25 8 C 29 5,32 10,30 16"/><line x1="20" y1="14" x2="20" y2="29"/>
       <path d="M20 29 L20 41"/><path d="M20 29 L13 25"/>
       <path d="M20 18 L26 10"/><path d="M20 18 L14 10"/>
       <circle cx="20" cy="9" r="6.2" fill="var(--accent)" stroke="none"/>
       <circle cx="25" cy="8" r="1.5" fill="#f0c050" stroke="none"/>`,
      // 3: 另一側
      `<ellipse cx="20" cy="43" rx="3" ry="1" fill="var(--accent)" stroke="none" opacity=".06"/>
       <line x1="20" y1="14" x2="20" y2="29"/><path d="M20 29 L20 41"/><path d="M20 29 L17 26"/>
       <path d="M20 18 L20 10"/>
       <circle cx="20" cy="9" r="5.4" fill="var(--accent)" stroke="none"/>`,
    ];
    const doJump=()=>{
      gsap.killTweensOf(parts);
      const sv=document.querySelector(g); if(!sv) return;
      const orig=sv.innerHTML;
      gsap.timeline({onComplete(){sv.innerHTML=orig;gsap.set(g,{y:0,rotation:2,scaleX:1,svgOrigin:"20 40"});startRun();gsap.delayedCall(3.5+Math.random()*2,doJump);}})
        // 收腿蓄力
        .to(`${g} .leg-f`,{rotation:80,svgOrigin:"19 29",duration:.18},0)
        .to(`${g} .leg-b`,{rotation:2,svgOrigin:"19 29",duration:.18},0)
        .to(`${g} .arm-f`,{rotation:-75,svgOrigin:"20 18",duration:.18},0)
        .to(`${g} .arm-b`,{rotation:70,svgOrigin:"20 18",duration:.18},0)
        .to(`${g} .pony, ${g} .tie`,{rotation:20,svgOrigin:"15 8",duration:.18},0)
        .to(`${g} .shadow`,{scaleX:.4,opacity:.06,svgOrigin:"20 43",duration:.18},0)
        // 跳起 + 逐格轉圈（正→側→背→側→正）
        .call(()=>{sv.innerHTML=PIRO[0];},[],0.20)
        .to(g,{y:-20,rotation:0,svgOrigin:"20 40",duration:.25,ease:"sine.out"},.20)
        .call(()=>{sv.innerHTML=PIRO[1];},[],0.33)
        .call(()=>{sv.innerHTML=PIRO[2];},[],0.46)
        .call(()=>{sv.innerHTML=PIRO[3];},[],0.59)
        .call(()=>{sv.innerHTML=PIRO[0];},[],0.72)
        .to(g,{y:-16,duration:.35,ease:"sine.inOut"},.45)
        // 落地
        .to(g,{y:0,duration:.22,ease:"bounce.out"},.80);
    };
    startRun();
    gsap.delayedCall(3.5+Math.random()*2,doJump);
  }
}
root.classList.remove("preanim");

// ---- 深淺色切換 ----
document.getElementById("themetog").addEventListener("click",()=>{
  const next=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=next;
  try{ localStorage.setItem("theme",next); }catch(e){}
});
</script>
