<!DOCTYPE html>
<html lang="zh-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24211d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>115 學年度第 1 學期行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=_t;}catch(e){document.documentElement.dataset.theme='light';}</script>
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('preanim')</script>
<style>
  :root{
    --paper:#fbf7f0; --card:#ffffff; --ink:#413b34; --muted:#7a7067;
    --line:#ece5db; --rail:#ddd5c9; --accent:#39755d; --accent-weak:#e3ede9;
    --holiday:#ab3b3a; --holiday-weak:#f7e3e2;
    --sport:#376b6d; --sport-weak:#e0eaea; /* 運動會 */
    --shadow:0 1px 2px rgba(75,70,65,.04),0 8px 22px rgba(75,70,65,.07);
    --shadow-lift:0 2px 8px rgba(64,91,85,.18),0 14px 30px rgba(75,70,65,.13);
  }
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{
      color-scheme:dark;
      --paper:#24211d; --card:#2c2823; --ink:#ece5d9; --muted:#a89f92;
      --line:#39332c; --rail:#463f37; --accent:#86b0a5; --accent-weak:#2b3733;
      --holiday:#d97b79; --holiday-weak:#3a2523;
      --sport:#96c3c4; --sport-weak:#22312f;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32);
      --shadow-lift:0 2px 8px rgba(134,176,165,.16),0 14px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{touch-action:manipulation}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background-color .3s cubic-bezier(.23,1,.32,1),color .3s cubic-bezier(.23,1,.32,1)}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 56px}
  .preanim .reveal{opacity:0}
  /* 骨架佔位：JS 注入內容前先撐開版位，避免整頁下推（CLS 0.57 -> 0）*/
  #list:empty{min-height:3030px}

  /* ---- header ---- */
  header{position:relative}
  .themetog{position:absolute;top:-2px;right:-2px;width:35px;height:35px;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;
    background:var(--card);color:var(--muted);cursor:pointer;box-shadow:var(--shadow);
    -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,transform .16s cubic-bezier(.23,1,.32,1)}
  .themetog:active{color:var(--accent);background:var(--accent-weak);transform:scale(.93)}
  @media(hover:hover)and(pointer:fine){.themetog:hover{color:var(--accent)}}
  .themetog .ic{width:22px;height:22px}
  .themetog .ic-moon{display:none}
  :root[data-theme="dark"] .themetog .ic-sun{display:none}
  :root[data-theme="dark"] .themetog .ic-moon{display:block}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;
    color:var(--muted);text-decoration:none;margin-bottom:10px;letter-spacing:.04em;transition:color .2s}
  .back:hover{color:var(--accent)}
  .back svg{width:14px;height:14px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--accent);margin:0 0 8px}
  h1{font-size:27px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
  .lede{font-size:14px;color:var(--muted);margin:8px 0 0}

  /* ---- 篩選 ---- */
  .filters{display:flex;gap:8px;margin:18px 0 4px}
  .fb{flex:0 0 auto;font-size:13.5px;font-weight:600;color:var(--muted);background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;box-shadow:var(--shadow);
    transition:color .2s,background .2s,border-color .2s,transform .16s cubic-bezier(.23,1,.32,1)}
  .fb:active{transform:scale(.95)}
  .fb[aria-pressed="true"]{color:var(--accent);background:var(--accent-weak);border-color:var(--accent-weak)}
  @media(hover:hover)and(pointer:fine){.fb:hover{color:var(--accent)}}

  /* ---- 月份 ---- */
  .mo{margin-top:26px}
  .mo-h{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:9px;
    padding:9px 2px 8px;background:var(--paper);border-bottom:1px solid var(--line)}
  .mo-h .m{font-size:19px;font-weight:700}
  .mo-h .y{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .mo-h .n{margin-left:auto;font-size:12px;color:var(--muted)}

  /* ---- 事件列 ---- */
  .ev{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:13px 0;
    border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .d{text-align:center}
  .ev .d .dd{font-size:24px;font-weight:700;line-height:1}
  .ev .d .wl{font-size:12px;color:var(--muted);margin-top:3px}
  .ev .rng2{font-size:11.5px;color:var(--muted);margin-top:2px}
  .ev .txt{align-self:center;font-size:16px;font-weight:500}
  .ev.holiday .d .dd{color:var(--holiday)}
  .ev.sport .d .dd,.ev.sport .txt{color:var(--sport)}
  .ev.sport .txt{font-weight:600}
  .ev.sport .tag{color:var(--sport);background:var(--sport-weak)}
  .ev .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;
    border-radius:999px;margin-left:8px;vertical-align:middle;
    color:var(--holiday);background:var(--holiday-weak)}
  .ev.past{opacity:.42}
  .ev.today .d .dd,.ev.today .txt{color:var(--accent)}
  .ev.today .txt{font-weight:700}
  .ev.today .tag.now{color:var(--accent);background:var(--accent-weak)}

  /* ---- 今天分隔線 ---- */
  .todayline{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:center;padding:6px 0}
  .todayline .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-align:center}
  .todayline .rule{height:2px;background:linear-gradient(90deg,var(--accent),transparent);
    transform-origin:left center}

  .empty{color:var(--muted);font-size:15px;padding:22px 0}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;line-height:1.7}
  footer a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  @media (max-width:360px){h1{font-size:23px}.wrap{padding:22px 14px 48px}}
</style>

<div class="wrap">
  <header>
    <button class="themetog" id="themetog" type="button" aria-label="切換深色／淺色">
      <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="back reveal" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>回課表
    </a>
    <p class="eyebrow reveal">鎮昌國小 · 115 學年度第 1 學期</p>
    <h1 class="reveal">完整行事曆</h1>
    <p class="lede reveal" id="lede" role="status"></p>
    <div class="filters reveal">
      <button class="fb" id="f-up" type="button" aria-pressed="false">只看之後</button>
      <button class="fb" id="f-hol" type="button" aria-pressed="false">只看放假</button>
    </div>
  </header>

  <div id="list"></div>

  <footer>
    資料來源：鎮昌國小 115 學年度第 1 學期重要行事曆<br>
    <a href="index.html">回到每日課表</a>　·　<a href="school.html">開學準備</a>　·　<a href="snack.html">點心表</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="events.js"></script>
<script>
const root=document.documentElement;
const canAnim=!!window.gsap && matchMedia("(prefers-reduced-motion: no-preference)").matches;
const WL=["日","一","二","三","四","五","六"];
const MO=["一","二","三","四","五","六","七","八","九","十","十一","十二"];
const pad=n=>String(n).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const md=dt=>`${pad(dt.getMonth()+1)}/${pad(dt.getDate())}`;

const now=new Date();
const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());

// 事件 → {s,e,txt,holiday,state}；state: past / today / future
const ITEMS=EVENTS.map(ev=>{
  const s=parse(ev[0]), e=ev[1]?parse(ev[1]):s;
  return {s,e,txt:ev[2],holiday:ev[3],tone:ev[4]||"",
    state: e<today ? "past" : (s<=today ? "today" : "future")};
});
console.assert(ITEMS.length===EVENTS.length&&ITEMS.every(i=>i.e>=i.s),"事件日期區間顛倒");

const upcoming=ITEMS.filter(i=>i.state!=="past").length;
document.getElementById("lede").textContent =
  `共 ${ITEMS.length} 項，還有 ${upcoming} 項尚未發生。`;

let onlyUpcoming=false, onlyHoliday=false;
function render(){
  const list=ITEMS.filter(i=>(!onlyUpcoming||i.state!=="past")&&(!onlyHoliday||i.holiday));
  document.getElementById("lede").textContent = (onlyUpcoming||onlyHoliday)
    ? `篩選後 ${list.length} 項。`
    : `共 ${ITEMS.length} 項，還有 ${upcoming} 項尚未發生。`;
  const box=document.getElementById("list");
  if(!list.length){ box.innerHTML=`<div class="empty">沒有符合的項目。</div>`; return; }
  let out="", mo="", ruled=false;
  list.forEach(i=>{
    const key=i.s.getFullYear()+"-"+i.s.getMonth();
    if(key!==mo){
      if(mo) out+="</section>";
      mo=key;
      const n=list.filter(x=>x.s.getFullYear()+"-"+x.s.getMonth()===key).length;
      out+=`<section class="mo reveal"><div class="mo-h">
        <span class="m">${MO[i.s.getMonth()]}月</span>
        <span class="y num">${i.s.getFullYear()}</span>
        <span class="n num">${n} 項</span></div>`;
    }
    // 第一個「尚未發生」的項目前插入今天的分隔線
    if(!ruled && i.state!=="past" && !onlyUpcoming){
      ruled=true;
      out+=`<div class="todayline reveal"><span class="lbl">今天</span><span class="rule"></span></div>`;
    }
    const rng=i.e>i.s?`${md(i.s)}–${md(i.e)}`:"";
    out+=`<div class="ev reveal ${i.state} ${i.holiday?'holiday':''} ${i.tone}">
      <div class="d"><div class="dd num">${i.s.getDate()}</div>
        <div class="wl">週${WL[i.s.getDay()]}</div>
        ${rng?`<div class="rng2 num">${rng}</div>`:""}</div>
      <div class="txt">${i.txt}${i.holiday?'<span class="tag">放假</span>':""}${
        i.state==="today"?'<span class="tag now">進行中</span>':""}</div></div>`;
  });
  out+="</section>";
  box.innerHTML=out;
  if(canAnim){
    gsap.set("#list .reveal",{autoAlpha:0,y:10});
    gsap.to("#list .reveal",{autoAlpha:1,y:0,duration:.4,stagger:.02,ease:"power2.out"});
  }
}
render();

function toggle(btn,set){
  btn.addEventListener("click",()=>{
    const on=btn.getAttribute("aria-pressed")!=="true";
    btn.setAttribute("aria-pressed",on);
    set(on); render();
  });
}
toggle(document.getElementById("f-up"),v=>onlyUpcoming=v);
toggle(document.getElementById("f-hol"),v=>onlyHoliday=v);

// 開啟時捲到今天（過去的項目太多會蓋掉重點）
const first=document.querySelector(".ev.today, .ev.future");
if(first) first.scrollIntoView({block:"center"});

if(canAnim){
  gsap.set("header .reveal",{autoAlpha:0,y:14});
  gsap.to("header .reveal",{autoAlpha:1,y:0,duration:.5,stagger:.07,ease:"power2.out"});
  gsap.from(".todayline .rule",{scaleX:0,duration:.7,delay:.3,ease:"power3.out"});
}
root.classList.remove("preanim");

document.getElementById("themetog").addEventListener("click",()=>{
  const next=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=next;
  try{ localStorage.setItem("theme",next); }catch(e){}
});
</script>
